name: iOS

on:
  push:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload an archive to TestFlight when Apple secrets are present
        type: boolean
        default: false

# Build and screenshots use GitHub-hosted macOS only. The TestFlight upload
# runs only when ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, and signing material
# are already stored, and only on main or a manual dispatch with upload=true.
# Missing secrets skip the upload and do not fail this workflow. Secret values
# are never printed. The upload does not submit the app for App Review.
jobs:
  simulator:
    name: Build, test, 6.7-inch screenshots
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Build, test, and capture screenshots
        run: bash scripts/ci-simulator.sh

      - name: Upload 6.7-inch screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots-6.7
          path: AppStore/screenshots/6.7-inch
          if-no-files-found: ignore

  app-store:
    name: TestFlight archive (gated)
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      API_KEY_ID: ${{ secrets.API_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      API_ISSUER_ID: ${{ secrets.API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
      APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      ASC_KEY: ${{ secrets.ASC_KEY }}
      AUTH_KEY_P8: ${{ secrets.AUTH_KEY_P8 }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.DISTRIBUTION_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
      CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
      P12_BASE64: ${{ secrets.P12_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
      BUILD_CERTIFICATE_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      PROVISION_PROFILE_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      APPLE_DEVELOPER_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      VAR_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      VAR_DEVELOPMENT_TEAM: ${{ vars.DEVELOPMENT_TEAM }}
      VAR_TEAM_ID: ${{ vars.TEAM_ID }}
      VAR_APP_STORE_CONNECT_API_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
      VAR_APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Apple credentials
        id: creds
        run: bash scripts/apple-credentials.sh apple-credentials.txt

      - name: Upload credential report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-credentials
          path: apple-credentials.txt
          if-no-files-found: error

      - name: Archive and upload to TestFlight
        if: steps.creds.outputs.upload_ready == 'true' && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.upload))
        run: bash scripts/archive-and-upload.sh

      - name: Explain TestFlight gate
        if: always() && steps.creds.outcome == 'success'
        run: |
          echo "upload_ready=${{ steps.creds.outputs.upload_ready }}"
          echo "signing_path=${{ steps.creds.outputs.signing_path }}"
          echo "missing=${{ steps.creds.outputs.missing_secrets }}"
          echo "This job uploads a build for TestFlight processing only. It does not submit the app for App Review."
          if [ "${{ steps.creds.outputs.upload_ready }}" != "true" ]; then
            echo "Upload skipped. Provide ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, and signing (APPLE_TEAM_ID, or the distribution p12, p12 password, and App Store profile)."
            exit 0
          fi
          if [ "${{ github.ref }}" != "refs/heads/main" ] && [ "${{ inputs.upload }}" != "true" ]; then
            echo "Upload skipped. It runs on main, or when this workflow is dispatched with upload enabled."
          fi
