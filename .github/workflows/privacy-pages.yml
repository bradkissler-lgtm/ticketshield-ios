name: Privacy Pages

# Optional. The supported setup is Settings → Pages → Deploy from a branch →
# main / docs, enabled after this folder is on main. Do not turn this
# workflow on at the same time: Actions deployment and branch deployment
# fight over the same Pages site. This file does not run on push, so a
# missing Pages environment does not fail CI.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: privacy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
